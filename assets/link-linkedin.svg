<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="Linkedin: Let's connect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17123a"/><stop offset="1" stop-color="#0d0b1f"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2f7fd6"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7cc4ff" stop-opacity="0.35"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect x="2" y="2" width="316" height="92" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="320" height="96" fill="url(#bg)"/>
    <circle cx="48" cy="48" r="90" fill="url(#glow)"/>
    <rect x="-120" y="0" width="90" height="96" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-160;-160;420;420" keyTimes="0;0.18;0.53;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1.5" y="1.5" width="317" height="93" rx="22.5" fill="none" stroke="#7cc4ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="20" y="20" width="56" height="56" rx="16" fill="url(#ic)"/>
  <svg x="32" y="32" width="32" height="32" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><text x="12" y="16.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="11" fill="#fff">in</text></svg>
  <text x="94" y="40" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" font-size="13" letter-spacing="2" fill="#7cc4ff">LINKEDIN</text>
  <text x="94" y="67" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f3f0ff">Let's connect</text>
  <text x="294" y="40" text-anchor="end" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#7cc4ff" opacity="0.8">↗</text>
