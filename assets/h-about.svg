<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="About me">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/><stop offset="0.6" stop-color="#151036"/><stop offset="1" stop-color="#1e0f2e"/>
    </linearGradient>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff7eb6"/><stop offset="0.5" stop-color="#c49bff"/><stop offset="1" stop-color="#7cc4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity="0.06"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
  <text x="0" y="50" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" font-weight="600" fill="#ff7eb6">01.</text>
  <text x="50" y="52" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="url(#grad)" letter-spacing="-0.5">About me</text>
  <text x="1200" y="50" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" fill="#8e88b8"># the human behind the commits</text>
  <rect x="0" y="74" width="1200" height="2" rx="1" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="0" y="73" width="180" height="4" rx="2" fill="url(#grad)" filter="url(#glow)">
    <animate attributeName="x" values="0;1020;0" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
</svg>