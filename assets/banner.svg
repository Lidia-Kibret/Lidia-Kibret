<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Lidia Kibret — Software Engineering student, competitive programmer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/>
      <stop offset="0.55" stop-color="#151036"/>
      <stop offset="1" stop-color="#1e0f2e"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="620" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.5" stop-color="#c49bff"/>
      <stop offset="1" stop-color="#7cc4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;550 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#ff5fa2" stop-opacity="0.38"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#6a7dff" stop-opacity="0.40"/><stop offset="1" stop-color="#6a7dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#3ee0b5" stop-opacity="0.22"/><stop offset="1" stop-color="#3ee0b5" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1200" height="420" rx="26"/></clipPath>
    <clipPath id="r0"><rect x="108" y="226" height="40" width="0"><animate attributeName="width" values="0;395;395;0;0" keyTimes="0.000;0.090;0.260;0.310;1.000" dur="9s" repeatCount="indefinite"/></rect></clipPath><clipPath id="r1"><rect x="108" y="226" height="40" width="0"><animate attributeName="width" values="0;0;518;518;0;0" keyTimes="0.000;0.333;0.423;0.593;0.643;1.000" dur="9s" repeatCount="indefinite"/></rect></clipPath><clipPath id="r2"><rect x="108" y="226" height="40" width="0"><animate attributeName="width" values="0;0;378;378;0;0" keyTimes="0.000;0.667;0.757;0.927;0.977;1.000" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .sans { font-family: 'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif; }
      .prompt { font: 500 20px 'JetBrains Mono','Fira Code',Consolas,monospace; fill: #6ef0c2; }
      .cmd { fill: #8e88b8; }
      .hello { font: 600 30px 'Segoe UI','Inter',Helvetica,Arial,sans-serif; fill: #e9e6ff; }
      .nm { font: 800 78px 'Segoe UI','Inter',Helvetica,Arial,sans-serif; letter-spacing: -1.5px; }
      .role { font: 500 28px 'JetBrains Mono','Fira Code',Consolas,monospace; fill: #d7d2ff; }
      .caret { font: 500 28px 'JetBrains Mono',Consolas,monospace; fill: #ff7eb6; }
      .chip { fill: #ffffff; fill-opacity: 0.05; stroke: #a98bff; stroke-opacity: 0.55; }
      .chipt { font: 500 16px 'JetBrains Mono','Fira Code',Consolas,monospace; fill: #cfc7ff; text-anchor: middle; }
      .edge { stroke: #ffffff; stroke-opacity: 0.13; stroke-width: 2; }
      .node { fill: #1b1640; stroke: #ffffff; stroke-opacity: 0.25; stroke-width: 1.5; }
      .nlabel { font: 600 14px 'JetBrains Mono',Consolas,monospace; fill: #0d0b1f; text-anchor: middle; }
      .cap { font: 500 15px 'JetBrains Mono','Fira Code',Consolas,monospace; fill: #8e88b8; }
      .kw { fill: #ff7eb6; } .fn { fill: #7cc4ff; } .str { fill: #6ef0c2; }
      .ac { font: 700 15px 'JetBrains Mono',Consolas,monospace; fill: #6ef0c2; }
      .float { font: 600 22px 'JetBrains Mono',Consolas,monospace; fill: #ffffff; fill-opacity: 0.07; }
    </style>
  </defs>

