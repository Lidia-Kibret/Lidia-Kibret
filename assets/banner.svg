    <text x="74" y="256" class="caret">❯</text>
    <text x="112" y="256" class="role" clip-path="url(#r0)">Competitive Programmer</text><text x="112" y="256" class="role" clip-path="url(#r1)">Aspiring Full-Stack Developer</text><text x="112" y="256" class="role" clip-path="url(#r2)">Data Science Explorer</text>
