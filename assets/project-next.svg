<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="0 0 590 250" role="img" aria-label="Next Project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1f"/><stop offset="0.6" stop-color="#151036"/><stop offset="1" stop-color="#1e0f2e"/>
    </linearGradient>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff7eb6"/><stop offset="0.5" stop-color="#c49bff"/><stop offset="1" stop-color="#7cc4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity="0.06"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <radialGradient id="glowc"><stop offset="0" stop-color="#ff7eb6" stop-opacity="0.35"/><stop offset="1" stop-color="#ff7eb6" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="590" height="250" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="590" height="250" fill="url(#bg)"/><rect width="590" height="250" fill="url(#dots)"/>
    <circle cx="530" cy="40" r="170" fill="url(#glowc)">
      <animate attributeName="r" values="150;190;150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="510" y="92" font-size="56" opacity="0.9">🚧</text>
    <text x="34" y="50" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#ff7eb6">◌ IN PROGRESS</text>
    <text x="34" y="86" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#f3f0ff">Next Project</text>
    <text x="34" y="122" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#c9c2f5">Something new is compiling...</text><text x="34" y="148" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#c9c2f5">Follow along — it lands here soon.</text>
    <rect x="34" y="180" width="71" height="30" rx="15" fill="#ff7eb6" fill-opacity="0.12" stroke="#ff7eb6" stroke-opacity="0.5"/><text x="69.5" y="200" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#ff7eb6">React</text><rect x="115" y="180" width="89" height="30" rx="15" fill="#ff7eb6" fill-opacity="0.12" stroke="#ff7eb6" stroke-opacity="0.5"/><text x="159.5" y="200" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#ff7eb6">Node.js</text><rect x="214" y="180" width="89" height="30" rx="15" fill="#ff7eb6" fill-opacity="0.12" stroke="#ff7eb6" stroke-opacity="0.5"/><text x="258.5" y="200" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#ff7eb6">MongoDB</text>
    <rect x="0" y="246" width="590" height="4" fill="url(#grad)"/>
  </g>
  <rect x="0.75" y="0.75" width="588.5" height="248.5" rx="22" fill="none" stroke="#ff7eb6" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>